server.servlet.context-path=/portfolio-manager

spring.datasource.url=jdbc:postgresql://localhost:5432/sppd?currentSchema=spp
spring.datasource.username=spp
spring.datasource.password=spppostgres
spring.datasource.driverClassName=org.postgresql.Driver
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

spring.jackson.serialization.fail-on-empty-beans=false
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.serialization.write-date-timestamps-as-nanoseconds=false
spring.jackson.serialization.write-date-keys-as-timestamps=false
spring.jackson.default-property-inclusion=non-null
spring.jackson.deserialization.read-date-timestamps-as-nanoseconds=false
spring.jackson.deserialization.fail-on-unknown-properties=false
spring.jackson.deserialization.use-big-decimal-for-floats=true
spring.jackson.mapper.accept-case-insensitive-properties=true

spp.portfolio-manager.constituent-manager.forecast-periods=10d,30d,60d,90d
spp.portfolio-manager.constituent-manager.forecastpscore-history-days=30
spp.portfolio-manager.constituent-manager-configuration.forecastpscore-history-days-averages=3,5,10,15

